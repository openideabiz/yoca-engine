<text x="108" y="132" class="kicker">IL PUNTO DI PARTENZA</text>
<text x="970" y="132" text-anchor="end" class="number">02 / 09</text>
<text x="104" y="430" class="title">La tua visione ha</text><text x="104" y="534" class="title">bisogno di struttura.</text><text x="108" y="680" class="body">Le idee possono essere chiare nella tua testa</text><text x="108" y="728" class="body">e difficili da tradurre in decisioni,</text><text x="108" y="776" class="body">comunicazione e sistemi di lavoro.</text>
<rect x="108" y="1115" width="390" height="66" rx="33" fill="#F6F6F7" stroke="#1A1A1A" stroke-width="3"/>
<text x="136" y="1157" class="tag">DALL’INTUIZIONE ALLA STRUTTURA</text>
<path d="M108 1216H972" stroke="#ECECEF" stroke-width="3"/>
<text x="108" y="1250" class="footer">OPENIDEA.BIZ</text>
